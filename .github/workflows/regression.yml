# Build netgen and run the regression tests.
#
# This is a "reusable workflow":  it does not run by itself, but is called
# by other workflows, either by the one in the netgen repository (for pull
# requests to netgen) or by nightly.yml in this repository.
#
# Inputs:
#   netgen_repository, netgen_ref:  the netgen source to test.  If empty,
#	the repository and commit that triggered the calling workflow are
#	used, which is what the netgen repository's workflow wants (for a
#	pull request, that is the pull request merged into master).
#   tests_ref:  the version of this repository to use.

name: Regression tests

on:
  workflow_call:
    inputs:
      netgen_repository:
        type: string
        default: ''
      netgen_ref:
        type: string
        default: ''
      tests_ref:
        type: string
        default: main

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out netgen
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.netgen_repository != '' && inputs.netgen_repository || github.repository }}
          ref: ${{ inputs.netgen_ref != '' && inputs.netgen_ref || github.ref }}
          path: netgen

      - name: Check out the regression tests
        uses: actions/checkout@v7
        with:
          repository: RTimothyEdwards/netgen_regression_tests
          ref: ${{ inputs.tests_ref }}
          path: tests

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl-dev tk-dev

      - name: Build netgen
        working-directory: netgen
        run: |
          # Install under a prefix, so that the netgen command finds this
          # build's library and scripts without needing CAD_ROOT.
          # GCC 15 (Ubuntu 26.04) compiles C23 by default, which netgen's
          # source does not yet support, so use C17 for now.
          ./configure --prefix=${GITHUB_WORKSPACE}/install CFLAGS="-g -std=gnu17"
          make -j$(nproc)
          make install
          # Older versions of netgen's makefiles do not report a failed
          # build, so check that netgen was built and installed.
          if [ ! -f ${GITHUB_WORKSPACE}/install/lib/netgen/tcl/tclnetgen.so ]; then
            echo "::error::netgen was not built (see the errors below)"
            grep -B2 -A5 -E 'error|Error' make.log | head -100
            exit 1
          fi

      - name: Run the regression tests
        env:
          NETGEN: ${{ github.workspace }}/install/bin/netgen
        run: |
          cd netgen && echo "netgen: $(git log -1 --format='%h %s')" && cd ..
          set +e -o pipefail
          tests/run_tests.sh 2>&1 | tee results.txt
          status=$?
          # Show the results on the workflow run's summary page
          echo '```' >> ${GITHUB_STEP_SUMMARY}
          cat results.txt >> ${GITHUB_STEP_SUMMARY}
          echo '```' >> ${GITHUB_STEP_SUMMARY}
          exit ${status}

      - name: Save the output of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests
          path: tests/**/work/
          if-no-files-found: ignore
